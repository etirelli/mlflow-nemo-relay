# Use case 1, OpenShell edition: the infrastructure that stays OUTSIDE the sandbox.
#
#   docker compose up -d --build        (the Makefile runs this for you: `make up`)
#
# The agents do NOT run in compose. They run inside NVIDIA OpenShell sandboxes
# (see Makefile targets `sandboxes` and openshell/policy.yaml). Their traces leave
# through the OpenShell agent trace relay, which forwards them to otel-collector.
#
# Services
#   mlflow            MLflow tracking server with basic auth and OTLP ingestion  -> http://localhost:5000
#   mlflow-bootstrap  one-shot: creates the agent service account, experiments, and permissions
#   otel-collector    receives the agents' traces from the OpenShell agent trace relay and
#                     forwards them to MLflow as the agent service account, routed by Relay mode -> :4318
#                     (the sandboxes have no MLflow credentials and no route to MLflow)
#   ollama            optional local LLM (profile "ollama")

name: uc1-openshell

services:
  mlflow:
    build:
      context: ./mlflow
      dockerfile: Containerfile
    image: localhost/uc1-openshell-mlflow:latest
    pull_policy: build
    environment:
      MLFLOW_AUTH_ADMIN_PASSWORD: ${MLFLOW_ADMIN_PASSWORD:-mlflow-admin-demo-password}
      MLFLOW_FLASK_SERVER_SECRET_KEY: ${MLFLOW_SECRET_KEY:-uc1-demo-secret-key-change-me}
      # host.openshell.internal is the Host header the sandboxed agents send.
      MLFLOW_ALLOWED_HOSTS: "mlflow,mlflow:5000,localhost,localhost:*,127.0.0.1,127.0.0.1:*,host.openshell.internal,host.openshell.internal:*"
    ports:
      # Published on all interfaces so the OpenShell supervisor can reach it
      # through the host gateway. Use a firewall or bind to a specific
      # interface on shared networks.
      - "${MLFLOW_PORT:-5000}:5000"
    volumes:
      - mlflow-data:/mlflow/data
      - mlflow-artifacts:/mlflow/artifacts
    healthcheck:
      # Shell form: Podman splits exec-form arguments that contain spaces.
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://localhost:5000/health')\""]
      interval: 5s
      timeout: 3s
      start_period: 60s
      retries: 40
    restart: unless-stopped

  mlflow-bootstrap:
    image: localhost/uc1-openshell-mlflow:latest
    pull_policy: never
    command: ["python", "/opt/demo/bootstrap.py"]
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_TRACKING_USERNAME: admin
      MLFLOW_TRACKING_PASSWORD: ${MLFLOW_ADMIN_PASSWORD:-mlflow-admin-demo-password}
      AGENT_MLFLOW_USERNAME: ${AGENT_MLFLOW_USERNAME:-relay-agent}
      AGENT_MLFLOW_PASSWORD: ${AGENT_MLFLOW_PASSWORD:-relay-agent-demo-password}
      REDACTED_EXPERIMENT: uc1-openshell-redacted
      BASELINE_EXPERIMENT: uc1-openshell-baseline
    restart: "no"

  # `make infra` starts it after the bootstrap, with the experiment ids it looks up.
  otel-collector:
    image: docker.io/otel/opentelemetry-collector-contrib:0.165.0
    command: ["--config=/etc/otelcol/collector.yaml"]
    environment:
      AGENT_MLFLOW_USERNAME: ${AGENT_MLFLOW_USERNAME:-relay-agent}
      AGENT_MLFLOW_PASSWORD: ${AGENT_MLFLOW_PASSWORD:-relay-agent-demo-password}
      REDACTED_EXPERIMENT_ID: ${REDACTED_EXPERIMENT_ID:-}
      BASELINE_EXPERIMENT_ID: ${BASELINE_EXPERIMENT_ID:-}
    ports:
      # Published on all interfaces so the OpenShell supervisor can reach it at
      # host.openshell.internal (openshell/gateway-agent-relay.toml). Use a firewall on shared networks.
      - "${RELAY_COLLECTOR_PORT:-4318}:4318"
    volumes:
      - ./otel/collector.yaml:/etc/otelcol/collector.yaml:ro
    restart: unless-stopped

  # Optional containerized LLM. On macOS, a native Ollama install is much faster
  # (containers have no GPU access there). See docs/configuration.md.
  ollama:
    image: docker.io/ollama/ollama:0.40.13
    profiles: ["ollama"]
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

volumes:
  mlflow-data:
  mlflow-artifacts:
  ollama-models:
