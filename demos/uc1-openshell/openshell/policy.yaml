# OpenShell sandbox policy for the UC1 customer lookup agent.
#
#   make lint     # openshell-prover check; OpenShell 0.1.9 has no `policy lint`
#   openshell sandbox create --policy openshell/policy.yaml ...
#   openshell policy set <sandbox> --policy openshell/policy.yaml --wait   # live update
#
# Layers of control in this demo:
#   NeMo Relay  -> WHAT the agent's telemetry may contain (SSN redacted before export)
#   OpenShell   -> WHERE the agent process may connect and WHAT it may touch on disk
#   MLflow      -> the evidence: tool outcomes, timing, errors (including denials)
#
# Everything not listed below is denied. In particular the agent cannot reach
# the "partner CRM" (partner-crm.example.com), PyPI, or any other internet host,
# so even a buggy or prompt-injected tool cannot ship customer records out.
#
# MLflow is NOT in this file. The agent's traces leave through the OpenShell
# agent trace relay, a gateway setting (openshell/gateway-agent-relay.toml), so
# the agent process has no network route to MLflow and no MLflow credentials.
#
# filesystem_policy, landlock and process apply at sandbox start.
# network_policies are live: `openshell policy set` / `policy update` hot-reloads them.

version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /usr          # Python interpreter and site-packages (agent code, Relay, LangGraph)
    - /lib
    - /etc
    - /app          # Relay telemetry policy files
    - /proc
    - /dev/urandom
    - /var/log
  read_write:
    - /sandbox      # workspace; Relay's local ATOF event file lives in /sandbox/telemetry
    - /tmp          # rendered Relay plugin config
    - /dev/null

landlock:
  compatibility: best_effort

network_policies:
  # Native Ollama on the laptop (default LLM). Only chat completions.
  # For build.nvidia.com, attach the provider in openshell/providers/ instead:
  # the provider contributes its own endpoint rule and injects the API key.
  local_llm:
    name: ollama-chat-completions
    endpoints:
      - host: host.openshell.internal
        port: 11434
        protocol: rest
        enforcement: enforce
        rules:
          - allow:
              method: POST
              path: /v1/chat/completions
          - allow:
              method: GET
              path: /v1/models
    binaries:
      # Scripts run as their interpreter; list the real path, not a symlink.
      - path: /usr/local/bin/python3.12
