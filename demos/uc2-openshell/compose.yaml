# Use case 2, OpenShell edition: the infrastructure that stays OUTSIDE the sandboxes.
#
#   podman compose up -d --build        (the Makefile runs this for you: `make up`)
#
# The two agent versions do NOT run in compose. They run inside NVIDIA OpenShell
# sandboxes (Makefile target `sandboxes`, openshell/policy.yaml) and reach these
# services through the sandbox's policy-enforced egress at host.openshell.internal.
#
# Services
#   mlflow            MLflow tracking server with basic auth and OTLP ingestion  -> http://localhost:5000
#   mlflow-bootstrap  one-shot: agent service account, experiments, least-privilege grant
#   payments          Synthetica payments service: refunds, credits, ledger     -> http://localhost:8090
#                     (the sandbox may call only POST /v1/refunds)

name: uc2-openshell

services:
  mlflow:
    build:
      context: ./mlflow
      dockerfile: Containerfile
    image: localhost/uc2-openshell-mlflow:latest
    pull_policy: build
    environment:
      MLFLOW_AUTH_ADMIN_PASSWORD: ${MLFLOW_ADMIN_PASSWORD:-mlflow-admin-demo-password}
      MLFLOW_FLASK_SERVER_SECRET_KEY: ${MLFLOW_SECRET_KEY:-uc2-demo-secret-key-change-me}
      # host.openshell.internal is the Host header the sandboxed agents send.
      MLFLOW_ALLOWED_HOSTS: "mlflow,mlflow:5000,localhost,localhost:*,127.0.0.1,127.0.0.1:*,host.openshell.internal,host.openshell.internal:*"
    ports:
      # Published on all interfaces so the OpenShell supervisor can reach it
      # through the host gateway. Use a firewall on shared networks.
      - "${MLFLOW_PORT:-5000}:5000"
    volumes:
      - mlflow-data:/mlflow/data
      - mlflow-artifacts:/mlflow/artifacts
    healthcheck:
      # Shell form: Podman splits exec-form arguments that contain spaces.
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://localhost:5000/health')\""]
      interval: 5s
      timeout: 3s
      start_period: 60s
      retries: 40
    restart: unless-stopped

  mlflow-bootstrap:
    image: localhost/uc2-openshell-mlflow:latest
    pull_policy: never
    command: ["python", "/opt/demo/bootstrap.py"]
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_TRACKING_USERNAME: admin
      MLFLOW_TRACKING_PASSWORD: ${MLFLOW_ADMIN_PASSWORD:-mlflow-admin-demo-password}
      AGENT_MLFLOW_USERNAME: ${AGENT_MLFLOW_USERNAME:-relay-agent}
      AGENT_MLFLOW_PASSWORD: ${AGENT_MLFLOW_PASSWORD:-relay-agent-demo-password}
      TRACE_EXPERIMENT: uc2-openshell-refund-agent
      EVAL_EXPERIMENT: uc2-openshell-refund-agent-eval
    restart: "no"

  payments:
    build:
      context: ./payments
      dockerfile: Containerfile
    image: localhost/uc2-openshell-payments:latest
    pull_policy: build
    ports:
      # Published on all interfaces so the OpenShell supervisor can reach it.
      - "${PAYMENTS_PORT:-8090}:8090"
    volumes:
      - payments-ledger:/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://localhost:8090/healthz')\""]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  mlflow-data:
  mlflow-artifacts:
  payments-ledger:
