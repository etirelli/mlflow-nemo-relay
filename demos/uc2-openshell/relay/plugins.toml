# NeMo Relay plugin configuration for the UC2 OpenShell support agent (both versions).
#
# Same telemetry setup as UC1 (OTLP export + pii_redaction). The refund
# guardrail is registered in code (support_agent/policy.py): Relay 0.11 has no
# config-file component for custom conditional-execution guardrails.
#
# The agent expands ${VAR} placeholders from its environment at startup
# (see agent/src/support_agent/relay_runtime.py), then passes this
# file to nemo_relay.plugin.activate().
#
# Pipeline:  agent tool/LLM call -> Relay event -> pii_redaction sanitizers
#            -> subscribers/exporters (OTLP to the OpenShell agent trace relay, local ATOF file)
# The tool and the LLM always receive the original, unredacted values.

version = 1

[policy]
unknown_component = "error"
unknown_field = "error"
unsupported_value = "error"

# ---------------------------------------------------------------------------
# Observability: export OpenInference-shaped OTLP traces through the OpenShell
# agent trace relay. The relay forwards them to the demo's OpenTelemetry
# Collector (otel/collector.yaml), which adds the MLflow credentials and the
# experiment header. The sandbox holds no MLflow credentials and has no
# network route to MLflow.
# ---------------------------------------------------------------------------
[[components]]
kind = "observability"
enabled = true

[components.config]
version = 4
# Relay requires HTTPS for non-loopback OTLP endpoints. The relay address
# (192.0.0.8) is served by the OpenShell supervisor inside the sandbox boundary,
# so plain HTTP never crosses a network there.
insecure_http_hosts = ["192.0.0.8"]

[components.config.opentelemetry]
enabled = true

[[components.config.opentelemetry.endpoints]]
# MLflow translates OpenInference span kinds into MLflow span types
# (AGENT, CHAIN, LLM, TOOL), so traces render natively in the MLflow UI.
type = "openinference"
# The agent trace relay, at the address OpenShell injects; Relay appends /v1/traces.
endpoint = "${OTEL_EXPORTER_OTLP_ENDPOINT}"
transport = "http_binary"
service_name = "support-agent"
service_version = "uc2-openshell"
scheduled_delay_millis = 500
timeout_millis = 10000

[components.config.opentelemetry.endpoints.resource_attributes]
"demo.use_case" = "uc2"
"demo.agent_version" = "${AGENT_VERSION}"
"demo.policy" = "refund-limit-${POLICY_VERSION}"
"demo.sandbox" = "${SANDBOX_NAME}"

# Local copy of the same (sanitized) canonical event stream, for inspection
# and for the automated verification script.
[components.config.atof]
enabled = true

[[components.config.atof.sinks]]
type = "file"
output_directory = "${RELAY_TELEMETRY_DIR}"
filename = "atof-${AGENT_VERSION}.jsonl"
mode = "append"

# ---------------------------------------------------------------------------
# PII redaction: remove the SSN from every exported surface.
# ---------------------------------------------------------------------------
[[components]]
kind = "pii_redaction"
enabled = true

[components.config]
version = 1

# Profile 1 - field-level: redact the `ssn` field wherever it appears as a
# top-level key of a tool argument or tool result document, whatever its format.
[[components.config.profiles]]
mode = "builtin"
priority = 10

[components.config.profiles.builtin]
action = "redact"
pattern = '(?s).+'
target_paths = ["/ssn"]
replacement = "[REDACTED-SSN]"

# Profile 2 - pattern-based: redact SSN-shaped values in every other string
# leaf: user messages, LLM prompts and responses, echoed tool results, and
# tool error details. Relay has no built-in SSN detector, so we supply a regex.
# The separators are required on purpose: an undashed \d{9} pattern also
# matches unrelated numbers such as nanosecond timestamp fractions. Profile 1
# covers the structured `ssn` field whatever its format.
[[components.config.profiles]]
mode = "builtin"
priority = 20

[components.config.profiles.builtin]
action = "redact"
pattern = '\b\d{3}[- ]\d{2}[- ]\d{4}\b'
replacement = "[REDACTED-SSN]"
