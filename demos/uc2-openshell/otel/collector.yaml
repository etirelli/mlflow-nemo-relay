# OpenTelemetry Collector between the OpenShell agent trace relay and MLflow.
#
# The relay (gateway setting: openshell/gateway-agent-relay.toml) forwards the
# agents' OTLP traces here, with openshell.sandbox.id stamped on each resource.
# The collector adds the MLflow service account and the experiment header, so
# no MLflow credential or route exists inside the sandboxes. It also retries
# failed exports, which the relay does not (one attempt per batch).
#
# Environment (set by the Makefile and compose): AGENT_MLFLOW_USERNAME,
# AGENT_MLFLOW_PASSWORD, TRACE_EXPERIMENT_ID.

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  # MLflow keeps span attributes; copy the relay's attribution onto every span.
  transform/relay-attribution:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - set(attributes["openshell.sandbox.id"], resource.attributes["openshell.sandbox.id"]) where resource.attributes["openshell.sandbox.id"] != nil
          - set(attributes["openshell.telemetry.source"], resource.attributes["openshell.telemetry.source"]) where resource.attributes["openshell.telemetry.source"] != nil
  batch: {}

extensions:
  basicauth/mlflow:
    client_auth:
      username: ${env:AGENT_MLFLOW_USERNAME}
      password: ${env:AGENT_MLFLOW_PASSWORD}

exporters:
  otlp_http/mlflow:
    endpoint: http://mlflow:5000
    compression: none
    auth:
      authenticator: basicauth/mlflow
    headers:
      x-mlflow-experiment-id: ${env:TRACE_EXPERIMENT_ID}

service:
  extensions: [basicauth/mlflow]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [transform/relay-attribution, batch]
      exporters: [otlp_http/mlflow]
