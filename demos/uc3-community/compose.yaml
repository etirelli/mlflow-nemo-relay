# Use case 3, community edition: validate a policy change before rollout.
# Upstream MLflow + NVIDIA NeMo Relay (OSS) + LangGraph + Prometheus, on Podman or Docker.
#
#   make up        (or: podman compose up -d --build)
#
# The AGENT is fixed (UC2's v1 agent, which attempts large and split refunds).
# The POLICY changes: one service per Relay refund policy version.
#
# Services
#   mlflow            MLflow tracking server with basic auth and OTLP ingestion  -> http://localhost:5000
#   mlflow-bootstrap  one-shot: agent service account, experiments, least-privilege grant
#   agent-policy-v1   agent + refund-policy-v1 ($500 per call, in production)   -> http://localhost:8000
#   agent-policy-v2   agent + refund-policy-v2 ($500 per request, candidate)    -> http://localhost:8001
#   agent-policy-v3   agent + refund-policy-v3 ($300 per call, candidate)       -> http://localhost:8002
#   prometheus        scrapes /metrics: latency, decisions, CPU, memory          -> http://localhost:9090
#   verify            one-shot (profile "tools"): automated checks
#
# The LLM is any OpenAI-compatible endpoint, configured in .env (see .env.example).

name: uc3-community

x-agent: &agent
  image: localhost/uc3-support-agent:latest
  depends_on:
    mlflow-bootstrap:
      condition: service_completed_successfully
  volumes:
    - relay-telemetry:/app/telemetry
  restart: unless-stopped

x-agent-env: &agent-env
  LLM_PROVIDER: ${LLM_PROVIDER:-openai}
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  LLM_MODEL: ${LLM_MODEL:-}
  LLM_API_KEY: ${LLM_API_KEY:-not-needed}
  # Fixed agent revision; the policy version is set per service below.
  AGENT_VERSION: v1
  REFUND_LIMIT: ${REFUND_LIMIT:-500}
  TOOL_TIMEOUT_SECONDS: ${TOOL_TIMEOUT_SECONDS:-2.0}
  RELAY_PLUGINS_FILE: /app/relay/plugins.toml
  MLFLOW_TRACKING_URI: http://mlflow:5000
  MLFLOW_PUBLIC_URI: ${MLFLOW_PUBLIC_URI:-http://localhost:5000}
  MLFLOW_EXPERIMENT_NAME: uc3-policy-validation
  MLFLOW_TRACKING_USERNAME: ${AGENT_MLFLOW_USERNAME:-relay-agent}
  MLFLOW_TRACKING_PASSWORD: ${AGENT_MLFLOW_PASSWORD:-relay-agent-demo-password}
  PUBLIC_POLICY_V1_URL: http://localhost:${POLICY_V1_PORT:-8000}
  PUBLIC_POLICY_V2_URL: http://localhost:${POLICY_V2_PORT:-8001}
  PUBLIC_POLICY_V3_URL: http://localhost:${POLICY_V3_PORT:-8002}

services:
  mlflow:
    build:
      context: ./mlflow
      dockerfile: Containerfile
    image: localhost/uc3-mlflow:latest
    pull_policy: build
    environment:
      MLFLOW_AUTH_ADMIN_PASSWORD: ${MLFLOW_ADMIN_PASSWORD:-mlflow-admin-demo-password}
      MLFLOW_FLASK_SERVER_SECRET_KEY: ${MLFLOW_SECRET_KEY:-uc3-demo-secret-key-change-me}
      MLFLOW_ALLOWED_HOSTS: "mlflow,mlflow:5000,localhost,localhost:*,127.0.0.1,127.0.0.1:*"
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    volumes:
      - mlflow-data:/mlflow/data
      - mlflow-artifacts:/mlflow/artifacts
    healthcheck:
      # Shell form: Podman splits exec-form arguments that contain spaces.
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://localhost:5000/health')\""]
      interval: 5s
      timeout: 3s
      start_period: 60s
      retries: 40
    restart: unless-stopped

  mlflow-bootstrap:
    image: localhost/uc3-mlflow:latest
    pull_policy: never
    command: ["python", "/opt/demo/bootstrap.py"]
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_TRACKING_USERNAME: admin
      MLFLOW_TRACKING_PASSWORD: ${MLFLOW_ADMIN_PASSWORD:-mlflow-admin-demo-password}
      AGENT_MLFLOW_USERNAME: ${AGENT_MLFLOW_USERNAME:-relay-agent}
      AGENT_MLFLOW_PASSWORD: ${AGENT_MLFLOW_PASSWORD:-relay-agent-demo-password}
      TRACE_EXPERIMENT: uc3-policy-validation
      EVAL_EXPERIMENT: uc3-policy-validation-eval
    restart: "no"

  agent-policy-v1:
    <<: *agent
    # Only this service builds the shared image; the others reuse it.
    build:
      context: .
      dockerfile: agent/Containerfile
    pull_policy: build
    environment:
      <<: *agent-env
      POLICY_VERSION: v1
    ports:
      - "${POLICY_V1_PORT:-8000}:8000"

  agent-policy-v2:
    <<: *agent
    pull_policy: never
    environment:
      <<: *agent-env
      POLICY_VERSION: v2
    ports:
      - "${POLICY_V2_PORT:-8001}:8000"

  agent-policy-v3:
    <<: *agent
    pull_policy: never
    environment:
      <<: *agent-env
      POLICY_VERSION: v3
    ports:
      - "${POLICY_V3_PORT:-8002}:8000"

  prometheus:
    image: docker.io/prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped

  verify:
    image: localhost/uc3-support-agent:latest
    pull_policy: never
    profiles: ["tools"]
    command: ["python", "-m", "support_agent.verify"]
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_TRACKING_USERNAME: admin
      MLFLOW_TRACKING_PASSWORD: ${MLFLOW_ADMIN_PASSWORD:-mlflow-admin-demo-password}
      AGENT_MLFLOW_USERNAME: ${AGENT_MLFLOW_USERNAME:-relay-agent}
      AGENT_MLFLOW_PASSWORD: ${AGENT_MLFLOW_PASSWORD:-relay-agent-demo-password}
      DEMO_AGENT_URLS: http://agent-policy-v1:8000,http://agent-policy-v2:8000,http://agent-policy-v3:8000
      PROMETHEUS_URL: http://prometheus:9090
    volumes:
      - relay-telemetry:/app/telemetry:ro
    restart: "no"

volumes:
  mlflow-data:
  mlflow-artifacts:
  relay-telemetry:
  prometheus-data:
