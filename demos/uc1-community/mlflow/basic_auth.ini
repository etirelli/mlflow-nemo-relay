; MLflow basic-auth configuration for the demo server.
; On first start, MLflow creates the admin user with the password from the
; MLFLOW_AUTH_ADMIN_PASSWORD environment variable (set in compose / .env).
[mlflow]
; New users get no access by default. The bootstrap grants the agent's
; service account EDIT on the demo experiments only (project isolation).
default_permission = NO_PERMISSIONS
database_uri = sqlite:////mlflow/data/basic_auth.db
admin_username = admin
authorization_function = mlflow.server.auth:authenticate_request_basic_auth
grant_default_workspace_access = false
