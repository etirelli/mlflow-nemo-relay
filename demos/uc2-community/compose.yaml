# Use case 2, community edition: guardrail decisions -> better agents.
# Upstream MLflow + NVIDIA NeMo Relay (OSS) + LangGraph, on Podman or Docker.
#
#   make up        (or: podman compose up -d --build)
#
# Services
#   mlflow            MLflow tracking server with basic auth and OTLP ingestion  -> http://localhost:5000
#   mlflow-bootstrap  one-shot: agent service account, experiments, least-privilege grant
#   agent-v1          support agent v1 (original), Relay refund guardrail ON  -> http://localhost:8000
#   agent-v2          support agent v2 (improved), same guardrail             -> http://localhost:8001
#   verify            one-shot (profile "tools"): automated checks
#
# The LLM is any OpenAI-compatible endpoint, configured in .env (see .env.example).

name: uc2-community

x-agent: &agent
  image: localhost/uc2-support-agent:latest
  depends_on:
    mlflow-bootstrap:
      condition: service_completed_successfully
  volumes:
    - relay-telemetry:/app/telemetry
  restart: unless-stopped

x-agent-env: &agent-env
  LLM_PROVIDER: ${LLM_PROVIDER:-openai}
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  LLM_MODEL: ${LLM_MODEL:-}
  LLM_API_KEY: ${LLM_API_KEY:-not-needed}
  POLICY_VERSION: ${POLICY_VERSION:-v1}
  REFUND_LIMIT: ${REFUND_LIMIT:-500}
  TOOL_TIMEOUT_SECONDS: ${TOOL_TIMEOUT_SECONDS:-2.0}
  RELAY_PLUGINS_FILE: /app/relay/plugins.toml
  MLFLOW_TRACKING_URI: http://mlflow:5000
  MLFLOW_PUBLIC_URI: ${MLFLOW_PUBLIC_URI:-http://localhost:5000}
  MLFLOW_EXPERIMENT_NAME: uc2-refund-agent
  MLFLOW_TRACKING_USERNAME: ${AGENT_MLFLOW_USERNAME:-relay-agent}
  MLFLOW_TRACKING_PASSWORD: ${AGENT_MLFLOW_PASSWORD:-relay-agent-demo-password}
  PUBLIC_V1_AGENT_URL: http://localhost:${V1_AGENT_PORT:-8000}
  PUBLIC_V2_AGENT_URL: http://localhost:${V2_AGENT_PORT:-8001}

services:
  mlflow:
    build:
      context: ./mlflow
      dockerfile: Containerfile
    image: localhost/uc2-mlflow:latest
    pull_policy: build
    environment:
      MLFLOW_AUTH_ADMIN_PASSWORD: ${MLFLOW_ADMIN_PASSWORD:-mlflow-admin-demo-password}
      MLFLOW_FLASK_SERVER_SECRET_KEY: ${MLFLOW_SECRET_KEY:-uc2-demo-secret-key-change-me}
      MLFLOW_ALLOWED_HOSTS: "mlflow,mlflow:5000,localhost,localhost:*,127.0.0.1,127.0.0.1:*"
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    volumes:
      - mlflow-data:/mlflow/data
      - mlflow-artifacts:/mlflow/artifacts
    healthcheck:
      # Shell form: Podman splits exec-form arguments that contain spaces.
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://localhost:5000/health')\""]
      interval: 5s
      timeout: 3s
      start_period: 60s
      retries: 40
    restart: unless-stopped

  mlflow-bootstrap:
    image: localhost/uc2-mlflow:latest
    pull_policy: never
    command: ["python", "/opt/demo/bootstrap.py"]
    depends_on:
      mlflow:
        condition: service_healthy
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_TRACKING_USERNAME: admin
      MLFLOW_TRACKING_PASSWORD: ${MLFLOW_ADMIN_PASSWORD:-mlflow-admin-demo-password}
      AGENT_MLFLOW_USERNAME: ${AGENT_MLFLOW_USERNAME:-relay-agent}
      AGENT_MLFLOW_PASSWORD: ${AGENT_MLFLOW_PASSWORD:-relay-agent-demo-password}
    restart: "no"

  agent-v1:
    <<: *agent
    # Only this service builds the shared image; agent-v2 reuses it.
    build:
      context: .
      dockerfile: agent/Containerfile
    pull_policy: build
    environment:
      <<: *agent-env
      AGENT_VERSION: v1
    ports:
      - "${V1_AGENT_PORT:-8000}:8000"

  agent-v2:
    <<: *agent
    pull_policy: never
    environment:
      <<: *agent-env
      AGENT_VERSION: v2
    ports:
      - "${V2_AGENT_PORT:-8001}:8000"

  verify:
    image: localhost/uc2-support-agent:latest
    pull_policy: never
    profiles: ["tools"]
    command: ["python", "-m", "support_agent.verify"]
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_TRACKING_USERNAME: admin
      MLFLOW_TRACKING_PASSWORD: ${MLFLOW_ADMIN_PASSWORD:-mlflow-admin-demo-password}
      AGENT_MLFLOW_USERNAME: ${AGENT_MLFLOW_USERNAME:-relay-agent}
      AGENT_MLFLOW_PASSWORD: ${AGENT_MLFLOW_PASSWORD:-relay-agent-demo-password}
      DEMO_AGENT_URLS: http://agent-v1:8000,http://agent-v2:8000
    volumes:
      - relay-telemetry:/app/telemetry:ro
    restart: "no"

volumes:
  mlflow-data:
  mlflow-artifacts:
  relay-telemetry:
